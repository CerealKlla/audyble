plugins {
    id 'java-library'
    id 'maven-publish'
    id 'net.neoforged.moddev' version '2.0.147'
    id 'idea'
}

tasks.named('wrapper', Wrapper).configure {
    distributionType = Wrapper.DistributionType.BIN
}

version = mod_version
group = mod_group_id

sourceSets.main.resources {
    srcDir('src/generated/resources')
    exclude("**/*.bbmodel")
    exclude("src/generated/**/.cache")
}

repositories {
    // Simple Voice Chat API -- confirmed coordinate/repo, see gradle.properties.
    maven { url = 'https://maven.maxhenkel.de/repository/public' }
    // Modrinth's maven proxy -- hosts the real runtime SVC mod jar (with FML metadata), needed so
    // runClient/runServer/test dev environments all have a real mod satisfying the voicechat_api
    // hard dependency below, not just the api-only compile jar.
    maven { url = 'https://api.modrinth.com/maven' }
    // Maven Central -- hosts the com.googlecode.soundlibs:* Ogg Vorbis decode libraries (plain
    // Java, not Minecraft-related at all), 2026-11-02.
    mavenCentral()
}

base {
    archivesName = mod_id
}

// Mojang ships Java 25 to end users in 26.1.2, so mods should target Java 25.
java.toolchain.languageVersion = JavaLanguageVersion.of(25)

neoForge {
    version = project.neo_version

    runs {
        client {
            client()
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        server {
            server()
            programArgument '--nogui'
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        gameTestServer {
            type = "gameTestServer"
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        data {
            clientData()
            programArguments.addAll '--mod', project.mod_id, '--all', '--output', file('src/generated/resources/').getAbsolutePath(), '--existing', file('src/main/resources/').getAbsolutePath()
        }

        configureEach {
            systemProperty 'forge.logging.markers', 'REGISTRIES'
            logLevel = org.slf4j.event.Level.DEBUG
        }
    }

    mods {
        "${mod_id}" {
            sourceSet(sourceSets.main)
        }
    }

    unitTest {
        enable()
        testedMod = mods.named(mod_id)
    }
}

dependencies {

    // Nuclyus is a required foundation dependency (see neoforge.mods.toml) -- hard-imported by
    // every mod in the suite for shared base classes/contracts, starting with the cross-mod menu-
    // contribution system. Sibling repo, not published anywhere -- run ../Nuclyus's own build (or
    // the suite's sync-mods.sh) at least once before building this project.
    compileOnly files("../Nuclyus/build/libs/nuclyus-${nuclyus_version}.jar")
    testCompileOnly files("../Nuclyus/build/libs/nuclyus-${nuclyus_version}.jar")
    testRuntimeOnly files("../Nuclyus/build/libs/nuclyus-${nuclyus_version}.jar")

    // Settlemynts and Lyfe are optional soft dependencies (Murmur Crystal feature, 2026-11-02) --
    // see bridge.SettlemyntsMurmurBridge/bridge.LyfeKnowledgeBridge, the only two classes allowed
    // to reference their types directly, gated behind ModList.get().isLoaded(...) at runtime, same
    // isolation pattern Settlemynts' own optional deps (Lyfe/Myssions/etc.) already use.
    // compileOnly only -- testCompileOnly/testRuntimeOnly would pull Settlemynts' own hard
    // Cartographyr dependency into this mod's plain-JUnit test classpath for no reason.
    compileOnly files("../Settlemynts/build/libs/settlemynts-${settlemynts_version}.jar")
    compileOnly files("../Lyfe/build/libs/lyfe-${lyfe_version}.jar")

    implementation "de.maxhenkel.voicechat:voicechat-api:${voicechat_api_version}"
    // The real SVC mod jar, for runClient/runServer/test dev environments only -- never shipped
    // inside Audyble's own jar, players install SVC themselves as usual.
    runtimeOnly "maven.modrinth:simple-voice-chat:neoforge-${voicechat_mod_version}"

    // Ogg Vorbis decode for the Murmur Crystal's real-music source directory (2026-11-02) -- a
    // plain Java SPI plugin for javax.sound.sampled, not a Minecraft/NeoForge-aware library at
    // all, so (unlike SVC above) it has no other way to reach a player's game install and must be
    // embedded directly into this mod's own jar via the real "jarJar" Configuration this version
    // of ModDevGradle registers (confirmed via javap against the actual plugin jar -- there's no
    // `.ranged()`/version-range DSL on this version, just a plain non-transitive Configuration
    // that needs each library listed explicitly). These are tiny, pure-Java, no native component.
    // No separate "jogg" artifact exists on Maven Central (confirmed directly, not assumed) --
    // soundlibs' real jorbis build bundles JCraft's jogg classes into the one jar.
    implementation "com.googlecode.soundlibs:vorbisspi:1.0.3.3"
    implementation "com.googlecode.soundlibs:jorbis:0.0.17.4"
    implementation "com.googlecode.soundlibs:tritonus-share:0.3.7.4"
    jarJar "com.googlecode.soundlibs:vorbisspi:1.0.3.3"
    jarJar "com.googlecode.soundlibs:jorbis:0.0.17.4"
    jarJar "com.googlecode.soundlibs:tritonus-share:0.3.7.4"

    // MP3 decode, same treatment as the Ogg Vorbis SPI above (2026-11-02) -- real library test
    // files aren't guaranteed to be .ogg, so the music source directory needs to handle .mp3 too.
    // Both artifacts confirmed to exist on Maven Central directly (not assumed) before adding.
    implementation "com.googlecode.soundlibs:mp3spi:1.9.5.4"
    implementation "com.googlecode.soundlibs:jlayer:1.0.1.4"
    jarJar "com.googlecode.soundlibs:mp3spi:1.9.5.4"
    jarJar "com.googlecode.soundlibs:jlayer:1.0.1.4"

    testImplementation 'org.junit.jupiter:junit-jupiter:5.7.1'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.named('test', Test) {
    useJUnitPlatform()
}

var generateModMetadata = tasks.register("generateModMetadata", ProcessResources) {
    var replaceProperties = [
            minecraft_version      : minecraft_version,
            minecraft_version_range: minecraft_version_range,
            neo_version            : neo_version,
            mod_id                 : mod_id,
            mod_name               : mod_name,
            mod_license            : mod_license,
            mod_version            : mod_version,
    ]
    inputs.properties replaceProperties
    expand replaceProperties
    from "src/main/templates"
    into "build/generated/sources/modMetadata"
}
sourceSets.main.resources.srcDir generateModMetadata
neoForge.ideSyncTask generateModMetadata

publishing {
    publications {
        register('mavenJava', MavenPublication) {
            from components.java
        }
    }
    repositories {
        maven {
            url "file://${project.projectDir}/repo"
        }
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

idea {
    module {
        downloadSources = true
        downloadJavadoc = true
    }
}
