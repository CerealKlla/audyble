license="${mod_license}"

[[mods]] #mandatory

modId="${mod_id}" #mandatory

version="${mod_version}" #mandatory

displayName="${mod_name}" #mandatory

description='''
Advanced positional/acoustic voice chat, built on top of Simple Voice Chat as the underlying voice
transport. Lets per-listener audio treatment (muffling, attenuation, occlusion, radio filtering,
complete muting, etc.) be driven by Minecraft world geometry and gameplay state -- walls, distance,
equipment, status effects -- rather than every listener hearing an identical copy of a speaker's
voice.
'''

[[dependencies.${mod_id}]] #optional
    modId="neoforge" #mandatory
    type="required" #mandatory
    versionRange="[${neo_version},)" #mandatory
    ordering="NONE"
    side="BOTH"

[[dependencies.${mod_id}]]
    modId="minecraft"
    type="required"
    versionRange="${minecraft_version_range}"
    ordering="NONE"
    side="BOTH"

# Hard dependency on Simple Voice Chat -- this mod has no voice transport of its own, it intercepts
# and reprocesses SVC's own audio pipeline. Depends on "voicechat_api", not "voicechat" directly --
# that's the dedicated sub-mod-id SVC itself exposes (since its API module's own version 2.6.0) so
# addons can version against the API surface rather than the exact installed SVC build.
[[dependencies.${mod_id}]]
    modId="voicechat_api"
    type="required"
    reason="Audyble has no voice transport of its own -- it intercepts and reprocesses Simple Voice Chat's own audio pipeline per listener."
    versionRange="[2.6.0,)"
    ordering="AFTER"
    side="BOTH"

# Nuclyus is the suite's foundation mod -- required (not optional) for every mod, starting with the
# cross-mod menu-contribution system (see Nuclyus' own CLAUDE.md).
[[dependencies.${mod_id}]]
    modId="nuclyus"
    type="required"
    reason="Foundation mod for shared base classes/contracts across the suite."
    ordering="AFTER"
    side="BOTH"

# Optional dependencies for the Murmur Crystal feature (2026-11-02) -- no versionRange on either
# (an empty string there is an invalid range that makes FML reject an installed mod outright, not
# "accept any version"), and ordering="NONE" rather than "AFTER" to avoid a dependency-cycle crash
# if the other side ever declares "AFTER" back (same gotcha already documented in Settlemynts' own
# neoforge.mods.toml).
[[dependencies.${mod_id}]]
    modId="settlemynts"
    type="optional"
    reason="Finds a nearby settlement's Murmur Tower signal for the Murmur Crystal item to pick up."
    ordering="NONE"
    side="BOTH"

[[dependencies.${mod_id}]]
    modId="lyfe"
    type="optional"
    reason="Grants Cartographyr-skill location knowledge to a player listening to a Tier 3+ Murmur Tower."
    ordering="NONE"
    side="BOTH"
