# Sets default memory used for gradle commands. Can be overridden by user or command line properties.
org.gradle.jvmargs=-Xmx1G
org.gradle.daemon=true
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=true

# Environment Properties
# You can find the latest versions here: https://projects.neoforged.net/neoforged/neoforge
# The Minecraft version must agree with the Neo version to get a valid artifact
minecraft_version=26.1.2
# The Minecraft version range can use any release version of Minecraft as bounds.
# Snapshots, pre-releases, and release candidates are not guaranteed to sort properly
# as they do not follow standard versioning conventions.
minecraft_version_range=[26.1.2]
# The Neo version must agree with the Minecraft version to get a valid artifact
neo_version=26.1.2.109

## Mod Properties

# The unique mod identifier for the mod. Must be lowercase in English locale. Must fit the regex [a-z][a-z0-9_]{1,63}
# Must match the String constant located in the main mod class annotated with @Mod.
mod_id=audyble
# The human-readable display name for the mod.
mod_name=Audyble
# The license of the mod. Review your options at https://choosealicense.com/. All Rights Reserved is the default.
mod_license=All Rights Reserved
# The mod version. See https://semver.org/
mod_version=0.1.0
# The group ID for the mod. It is only important when publishing as an artifact to a Maven repository.
# This should match the base package used for the mod sources.
# See https://maven.apache.org/guides/mini/guide-naming-conventions.html
mod_group_id=com.github.cerealklla.audyble

# No sibling-mod dependencies within the Kyngdoms suite -- this mod is scoped to the voice/acoustic
# layer only (per-listener voice treatment built on Simple Voice Chat, plus gameplay-driven hearing
# control).

# Simple Voice Chat API -- confirmed 2026-10-15 via henkelmax/simple-voice-chat's own "26.1" branch
# (api module) and maven.maxhenkel.de's published maven-metadata.xml for de.maxhenkel.voicechat:
# voicechat-api. 2.6.20 is the latest api version published before the neoforge-2.6.21+26.1.2 mod
# build (Jul 2026); the api module's own versioning is intentionally forward/backward compatible
# (runtime mod exposes VoicechatApi#getApiVersion() for callers who need to check), so this does not
# need to match the installed server jar's exact version -- see context/decisions.md.
voicechat_api_version=2.6.20
# The real runtime SVC mod jar for the exact NeoForge/MC build this project targets -- pulled via
# Modrinth's own maven proxy (not maven.maxhenkel.de, which only hosts the thin api jar) so
# ./gradlew runClient/runServer/test all have a real "voicechat"/"voicechat_api" mod present without
# a manual jar drop into run/mods. Confirmed this exact build exists for 26.1.2 via the Modrinth API,
# 2026-10-15 (see context/decisions.md).
voicechat_mod_version=2.6.20+26.1.2

# Nuclyus's version, used only to locate its built jar in ../Nuclyus/build/libs for the required
# compileOnly dependency in build.gradle. Bump this when Nuclyus's own mod_version changes.
nuclyus_version=0.1.0
